services:
  - type: web
    name: kaabo
    runtime: node
    plan: free
    branch: claude/kabboo-local-multiplayer-game-5lcwsm
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REFRESH_TOKEN
        sync: false
      - key: SPOTIFY_USER_ID
        sync: false
